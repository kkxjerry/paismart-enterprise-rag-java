name: Java CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python experiment tools
        run: >-
          python -m unittest
          tools.test_qwen3_embedding_adapter
          tools.test_qwen_plus_rag_pipeline
          tools.test_qwen_plus_pair_judge
      - name: Test and package
        run: mvn --batch-mode --update-snapshots verify
      - name: Check CLI
        run: java -jar target/paismart-enterprise-rag.jar --help
